name: Build Nova AI Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Restore debug.keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure .env from GitHub Secrets
        env:
          OR_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          : > .env
          [ -n "$OR_KEY" ] && echo "OPENROUTER_API_KEY=$OR_KEY" >> .env || true
          [ -n "$GQ_KEY" ] && echo "GROQ_API_KEY=$GQ_KEY" >> .env || true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
